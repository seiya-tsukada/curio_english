name: Generate topic

on:
  schedule:
    # Every day at 06:00 JST
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Category id (empty = the category with the fewest topics)'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - space-science
          - technology
          - history
          - world-culture
          - business-economy
          - human-psychology
      provider:
        description: 'LLM provider (empty = repository variable LLM_PROVIDER, or claude)'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - claude
          - openai
          - gemini
      model:
        description: 'Model name (empty = repository variable LLM_MODEL, or the provider default)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-topic
  cancel-in-progress: false

# Provider and model: manual-run input > repository variable > default (claude).
env:
  LLM_PROVIDER: ${{ inputs.provider || vars.LLM_PROVIDER || 'claude' }}
  LLM_MODEL: ${{ inputs.model || vars.LLM_MODEL }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          case "$LLM_PROVIDER" in
            claude) key_name=ANTHROPIC_API_KEY ;;
            openai) key_name=OPENAI_API_KEY ;;
            gemini) key_name=GEMINI_API_KEY ;;
            *) echo "::error::Unknown LLM_PROVIDER: $LLM_PROVIDER"; exit 1 ;;
          esac
          if [ -n "${!key_name}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$key_name secret is not set (LLM_PROVIDER=$LLM_PROVIDER). Skipping topic generation."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  generate:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: npm ci

      - name: Generate topic
        id: generate
        run: |
          args=()
          if [ -n "$CATEGORY" ]; then args+=(--category "$CATEGORY"); fi
          uv run scripts/generate_topic.py "${args[@]}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CATEGORY: ${{ inputs.category }}

      # Validates the new file against the Zod schema (src/content/schema.ts)
      - name: Test and build
        run: |
          npm test
          npm run build

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TOPIC_ID: ${{ steps.generate.outputs.topic_id }}
          TITLE_EN: ${{ steps.generate.outputs.title_en }}
          TITLE_JA: ${{ steps.generate.outputs.title_ja }}
          CATEGORY: ${{ steps.generate.outputs.category }}
          GENERATED_BY: ${{ steps.generate.outputs.llm }}
        run: |
          branch="content/${TOPIC_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "content/topics/${TOPIC_ID}.json"
          git commit -m "Add topic: ${TITLE_EN}"
          git push origin "$branch"
          cat > "$RUNNER_TEMP/pr-body.md" <<BODY
          New topic generated by the scheduled workflow.

          - **Title:** ${TITLE_EN} / ${TITLE_JA}
          - **Category:** ${CATEGORY}
          - **Generated by:** ${GENERATED_BY}
          - **File:** \`content/topics/${TOPIC_ID}.json\`

          ### Review checklist
          - [ ] Facts are accurate (check anything surprising)
          - [ ] English is natural and matches the level
          - [ ] Japanese translations and notes are correct
          - [ ] Looks right in the Vercel preview

          Close this PR to discard the topic.
          BODY
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "Add topic: ${TITLE_EN}" \
            --body-file "$RUNNER_TEMP/pr-body.md"
